name: Deploy Pages Demo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages-demo.yaml"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      project_name:
        description: "Cloudflare Pages project name"
        required: false
        type: string
      api_base:
        description: "Public HTTPS URL of precompute_server, without a trailing slash"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-pages-demo-production
      cancel-in-progress: true
    env:
      PAGES_PROJECT: ${{ inputs.project_name || vars.FREY_PAGES_PROJECT }}
      API_BASE: ${{ inputs.api_base || vars.FREY_PUBLIC_API_BASE }}
    steps:
      - name: Validate deploy configuration
        run: |
          test -n "$PAGES_PROJECT" || (echo "Missing FREY_PAGES_PROJECT repository variable" >&2; exit 1)
          test -n "$API_BASE" || (echo "Missing FREY_PUBLIC_API_BASE repository variable" >&2; exit 1)
          case "$API_BASE" in
            https://*) ;;
            *) echo "API base must be a public HTTPS URL" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public demo
        env:
          VITE_FREY_ENGINE: http
          VITE_FREY_API_BASE: ${{ env.API_BASE }}
          VITE_FREY_DEMO_SEEDS_URL: /demo-seeds.json
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ env.PAGES_PROJECT }} --branch main
