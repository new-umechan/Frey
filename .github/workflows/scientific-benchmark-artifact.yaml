name: Scientific Benchmark Artifact

on:
    workflow_dispatch:
    schedule:
        - cron: "30 18 * * 0"

jobs:
    scientific-benchmark-artifact:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install wasm-pack
              run: cargo install wasm-pack --version 0.13.1 --locked

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Export scientific benchmark samples
              run: pnpm run bench:scientific:samples

            - name: Upload scientific benchmark artifact
              uses: actions/upload-artifact@v4
              with:
                  name: scientific-benchmark-samples
                  path: tests/scientific-benchmark/scientific-benchmark-samples.json
                  if-no-files-found: error
                  retention-days: 30
