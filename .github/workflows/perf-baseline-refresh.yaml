name: Perf Baseline Refresh

on:
    workflow_dispatch:
        inputs:
            create_pr:
                description: "Create PR with refreshed baseline files"
                required: true
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"

permissions:
    contents: write
    pull-requests: write

jobs:
    refresh-baseline:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install wasm-pack
              run: cargo install wasm-pack --version 0.13.1 --locked

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Refresh core perf baseline
              run: pnpm run perf:baseline

            - name: Refresh hydrology perf baseline
              run: pnpm run perf:baseline:hydrology

            - name: Upload baseline artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: perf-baseline-refresh
                  path: |
                      tests/perf/bench-baseline.json
                      tests/perf/hydrology-bench-baseline.json
                  if-no-files-found: error
                  retention-days: 14

            - name: Create pull request
              if: ${{ inputs.create_pr == 'true' }}
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: chore/perf-baseline-refresh
                  commit-message: "chore(perf): refresh CI baselines"
                  title: "chore(perf): refresh CI baselines"
                  body: |
                      Automated baseline refresh on GitHub Actions (ubuntu-latest, Node 20).
                      Updated files:
                      - tests/perf/bench-baseline.json
                      - tests/perf/hydrology-bench-baseline.json
                  add-paths: |
                      tests/perf/bench-baseline.json
                      tests/perf/hydrology-bench-baseline.json
