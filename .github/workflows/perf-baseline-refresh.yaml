name: Perf Baseline Refresh

on:
    workflow_dispatch:
        inputs:
            create_pr:
                description: "Create PR with refreshed baseline files"
                required: true
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"

permissions:
    contents: write
    pull-requests: write

jobs:
    refresh-baseline:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install wasm-pack
              run: cargo install wasm-pack --version 0.13.1 --locked

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Refresh core perf baseline
              run: pnpm run bench:perf:baseline

            - name: Check hydrology benchmark assets
              id: hydrology-assets
              shell: bash
              run: |
                  missing=0
                  for path in benches/data/terrain_ref.bin benches/data/hydro_input.bin; do
                      if [ ! -f "$path" ]; then
                          echo "missing_asset=$path" >> "$GITHUB_OUTPUT"
                          missing=1
                      fi
                  done
                  if [ "$missing" -eq 0 ]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Refresh hydrology perf baseline
              if: ${{ steps.hydrology-assets.outputs.ready == 'true' }}
              run: pnpm run bench:perf:baseline:hydrology

            - name: Skip hydrology perf baseline (assets missing)
              if: ${{ steps.hydrology-assets.outputs.ready != 'true' }}
              run: |
                  echo "Hydrology baseline refresh was skipped."
                  echo "Required files:"
                  echo "  - benches/data/terrain_ref.bin"
                  echo "  - benches/data/hydro_input.bin"

            - name: Upload baseline artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: perf-baseline-refresh
                  path: |
                      tests/perf/bench-baseline.json
                      tests/perf/hydrology-bench-baseline.json
                  if-no-files-found: error
                  retention-days: 14

            - name: Detect baseline changes
              id: detect-changes
              shell: bash
              run: |
                  if git diff --quiet -- tests/perf/bench-baseline.json tests/perf/hydrology-bench-baseline.json; then
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create pull request
              if: ${{ inputs.create_pr == 'true' && steps.detect-changes.outputs.has_changes == 'true' }}
              continue-on-error: true
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: chore/perf-baseline-refresh
                  commit-message: "chore(perf): refresh CI baselines"
                  title: "chore(perf): refresh CI baselines"
                  body: |
                      Automated baseline refresh on GitHub Actions (ubuntu-latest, Node 20).
                      Updated files may include:
                      - tests/perf/bench-baseline.json
                      - tests/perf/hydrology-bench-baseline.json (only when hydrology assets are present)
                  add-paths: |
                      tests/perf/bench-baseline.json
                      tests/perf/hydrology-bench-baseline.json

            - name: PR fallback note
              if: ${{ inputs.create_pr == 'true' && steps.detect-changes.outputs.has_changes == 'true' }}
              run: |
                  echo "If PR creation is blocked by repository policy, open it manually from:"
                  echo "  https://github.com/${{ github.repository }}/compare/main...chore/perf-baseline-refresh?expand=1"
