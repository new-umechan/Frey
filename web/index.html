<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Frey</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <main class="app-shell">
            <div class="viewport-panel" id="viewport-panel" aria-label="world viewport">
                <canvas id="mesh-canvas" aria-label="world mesh viewport"></canvas>
                <header class="brand-block" aria-hidden="true">
                    <h1>Frey</h1>
                    <p>プレートから文明までの<br />惑星シミュレータ</p>
                </header>

                <section
                    id="playback-overlay"
                    class="playback-overlay"
                    aria-label="playback overlay controls"
                >
                    <div class="playback-head-row">
                        <div class="playback-main-controls">
                            <button
                                id="seek-backward-button"
                                class="glyph-button"
                                type="button"
                                aria-label="前の履歴tickへ戻る"
                            >
                                <svg class="glyph-icon glyph-icon-chevron" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M10 12L6 8L10 4" />
                                </svg>
                            </button>
                            <button
                                id="play-toggle-button"
                                class="glyph-button glyph-play"
                                type="button"
                                aria-label="停止"
                            >
                                <svg class="glyph-icon glyph-icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M18 3H15C14.4477 3 14 3.44772 14 4V20C14 20.5523 14.4477 21 15 21H18C18.5523 21 19 20.5523 19 20V4C19 3.44772 18.5523 3 18 3Z" />
                                    <path d="M9 3H6C5.44772 3 5 3.44772 5 4V20C5 20.5523 5.44772 21 6 21H9C9.55228 21 10 20.5523 10 20V4C10 3.44772 9.55228 3 9 3Z" />
                                </svg>
                            </button>
                            <button
                                id="seek-forward-button"
                                class="glyph-button"
                                type="button"
                                aria-label="次の履歴tickへ進む"
                            >
                                <svg class="glyph-icon glyph-icon-chevron" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M6 4L10 8L6 12" />
                                </svg>
                            </button>
                        </div>
                        <p class="playback-tick">
                            <span id="playback-current-tick">0</span>/<span id="playback-max-tick">0</span> tick
                        </p>
                    </div>
                    <label class="playback-seek-track" for="history-seek-slider">
                        <input
                            id="history-seek-slider"
                            class="seek-slider"
                            type="range"
                            min="0"
                            max="0"
                            value="0"
                            step="1"
                        />
                        <span class="seek-range-labels" aria-hidden="true">
                            <span id="history-seek-min">-</span>
                            <span id="history-seek-max">-</span>
                        </span>
                    </label>
                </section>

                <div
                    id="plate-hover-popup"
                    class="plate-hover-popup"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>
            </div>

            <aside class="sidebar" id="sidebar" aria-label="sidebar">
                <div class="sidebar-body" id="sidebar-body">
                    <div class="sidebar-main">
                        <section class="panel status-panel">
                            <h2>Status</h2>
                            <p id="status-era">時代: 環境形成期</p>
                            <p id="era-scale-tick-label">1Tick: 1万年</p>
                            <p id="status-message" hidden>Initialization failed</p>
                            <div class="visually-hidden" aria-hidden="true">
                                <span id="stat-level">-</span>
                                <span id="stat-seed">-</span>
                                <span id="stat-plates">-</span>
                                <span id="stat-land">-</span>
                            </div>
                        </section>

                        <section class="panel">
                            <h2>Setting</h2>
                            <label class="toggle-row" for="debug-mode-toggle">
                                <span>D: Debug</span>
                                <span class="toggle-switch">
                                    <input id="debug-mode-toggle" type="checkbox" />
                                    <span class="toggle-slider" aria-hidden="true"></span>
                                </span>
                            </label>
                            <form id="seed-form" class="seed-form" autocomplete="off">
                                <label for="seed-input">S: Seed</label>
                                <input
                                    id="seed-input"
                                    name="seed"
                                    type="text"
                                    value="alpha"
                                    maxlength="64"
                                />
                            </form>
                        </section>

                        <section class="panel">
                            <h2>
                                View
                                <span class="view-context-suffix" id="view-cui-context"></span>
                            </h2>
                            <div class="view-cui" id="view-cui">
                                <div class="view-tree" id="view-cui-options" aria-live="polite"></div>
                            </div>
                            <div class="visually-hidden" aria-hidden="true">
                                <label class="view-item">
                                    <input type="radio" name="view-mode" value="normal" checked />
                                    <span>1: 通常（現在）</span>
                                </label>
                                <label class="view-item">
                                    <input type="radio" name="view-mode" value="plates" />
                                    <span>2: 地形</span>
                                </label>
                                <label class="view-item">
                                    <input type="radio" name="view-mode" value="mantle" />
                                    <span>2-2: マントル熱量</span>
                                </label>
                                <label class="view-item">
                                    <input type="radio" name="view-mode" value="climate" />
                                    <span>3: 気候</span>
                                </label>
                            </div>
                        </section>
                    </div>

                    <section class="panel history-panel">
                        <h2>History</h2>
                        <ul class="event-log-list" id="event-log-list" aria-live="polite"></ul>
                    </section>

                    <select id="era-scale-select" class="visually-hidden" aria-hidden="true" tabindex="-1">
                        <option value="crust">地殻形成期</option>
                        <option value="environment">環境形成期</option>
                        <option value="life">先史期</option>
                        <option value="civilization">文明成立期</option>
                        <option value="history">歴史展開期</option>
                    </select>
                    <div class="visually-hidden" aria-hidden="true">
                        <span id="era-weight-geology">-</span>
                        <span id="era-weight-climate">-</span>
                        <span id="era-weight-ecology">-</span>
                        <span id="era-weight-civilization">-</span>
                    </div>
                </div>
            </aside>
        </main>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
