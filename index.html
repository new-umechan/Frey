<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Frey Mesh Viewer</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <main class="app-shell">
            <header class="top-bar" aria-label="controls">
                <div class="title-block">
                    <h1>Frey</h1>
                    <p class="subtitle">大陸から文明までの世界生成モデル</p>
                </div>
                <form id="seed-form" class="seed-form" autocomplete="off">
                    <label for="seed-input">Seed (T)</label>
                    <input
                        id="seed-input"
                        name="seed"
                        type="text"
                        value="alpha"
                        placeholder="Enter seed"
                        maxlength="64"
                    />
                    <button type="submit">決定</button>
                </form>
            </header>
            <section class="workspace">
                <div class="viewport-panel" id="viewport-panel">
                    <canvas id="mesh-canvas" aria-label="world mesh viewport"></canvas>
                    <div
                        id="plate-hover-popup"
                        class="plate-hover-popup"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></div>
                </div>
                <aside class="sidebar" id="sidebar" aria-label="sidebar">
                    <button
                        id="sidebar-toggle"
                        class="sidebar-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="sidebar-body"
                    >
                        <span class="sidebar-toggle-text">Sidebar</span>
                        <span class="sidebar-toggle-icon" aria-hidden="true">›</span>
                    </button>
                    <div class="sidebar-body" id="sidebar-body">
                        <section class="panel">
                            <h2>Status</h2>
                            <p id="status-message">Initializing...</p>
                        </section>
                        <section class="panel">
                            <h2>Stats</h2>
                            <dl class="stats-list">
                                <div><dt>Vertices</dt><dd id="stat-vertices">-</dd></div>
                                <div><dt>Level</dt><dd id="stat-level">-</dd></div>
                                <div><dt>Seed</dt><dd id="stat-seed">-</dd></div>
                                <div><dt>Plates</dt><dd id="stat-plates">-</dd></div>
                                <div><dt>Land</dt><dd id="stat-land">-</dd></div>
                            </dl>
                        </section>
                        <section class="panel">
                            <h2>View</h2>
                            <div class="view-mode-group" role="radiogroup" aria-label="View mode">
                                <label class="view-mode-option">
                                    <input
                                        type="radio"
                                        name="view-mode"
                                        value="normal"
                                        checked
                                    />
                                    <span>1: 通常</span>
                                </label>
                                <label class="view-mode-option">
                                    <input type="radio" name="view-mode" value="plates" />
                                    <span>2: プレート</span>
                                </label>
                            </div>
                        </section>
                        <section class="panel">
                            <h2>Mode</h2>
                            <label class="toggle-row" for="debug-mode-toggle">
                                <span>Debug (D)</span>
                                <span class="toggle-switch">
                                    <input
                                        id="debug-mode-toggle"
                                        type="checkbox"
                                    />
                                    <span class="toggle-slider" aria-hidden="true"></span>
                                </span>
                            </label>
                        </section>
                        <section class="panel">
                            <h2>Era Scale</h2>
                            <label class="field-stack" for="era-scale-select">
                                <span class="field-label">時代プリセット</span>
                                <select id="era-scale-select" class="select-field">
                                    <option value="crust">地殻形成期</option>
                                    <option value="environment">環境形成期</option>
                                    <option value="life">生命誕生期</option>
                                    <option value="civilization">文明成立期</option>
                                    <option value="history">歴史展開期</option>
                                </select>
                            </label>
                            <div class="era-scale-summary" id="era-scale-summary" aria-live="polite">
                                <p id="era-scale-tick-label">1 Tick: -</p>
                                <dl class="era-scale-weights">
                                    <div><dt>地形</dt><dd id="era-weight-terrain">-</dd></div>
                                    <div><dt>河川</dt><dd id="era-weight-river">-</dd></div>
                                    <div><dt>気候</dt><dd id="era-weight-climate">-</dd></div>
                                    <div><dt>生態</dt><dd id="era-weight-ecology">-</dd></div>
                                    <div><dt>文明</dt><dd id="era-weight-civilization">-</dd></div>
                                </dl>
                            </div>
                        </section>
                        <section class="panel panel-note">
                            <h2>CONTROL</h2>
                            <p>ドラッグ: 回転</p>
                            <p>ホイール / ピンチ: ズーム</p>
                            <p>V: 地球儀 / 地図切替</p>
                            <p>D: デバッグ表示切替</p>
                        </section>
                    </div>
                </aside>
            </section>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
