[package]
name = "frey_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
hecs = "0.10"
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "climate_solo"
harness = false

[[bench]]
name = "hydrology_solo"
harness = false
